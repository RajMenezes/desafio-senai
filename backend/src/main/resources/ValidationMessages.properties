# Mensagens padrão do Bean Validation. O GlobalExceptionHandler prefixa com o nome do campo em snake_case,
# formando, por exemplo: "O campo 'agility' deve estar entre 1 e 100."
jakarta.validation.constraints.NotNull.message=é obrigatório
jakarta.validation.constraints.Min.message=deve ser no mínimo {value}
jakarta.validation.constraints.Max.message=deve ser no máximo {value}
jakarta.validation.constraints.Size.message=deve ter entre {min} e {max} itens
org.hibernate.validator.constraints.Range.message=deve estar entre {min} e {max}
