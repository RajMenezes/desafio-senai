# Sobe banco, API e interface com um comando: docker compose up -d --build
# As portas e as credenciais podem ser trocadas num arquivo .env (veja .env.example).
name: desafio-senai

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-desafio}
      POSTGRES_USER: ${DB_USERNAME:-desafio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-desafio}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-desafio} -d ${DB_NAME:-desafio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-desafio}
      DB_USERNAME: ${DB_USERNAME:-desafio}
      DB_PASSWORD: ${DB_PASSWORD:-desafio}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8080}/api/v1
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  db-data:
